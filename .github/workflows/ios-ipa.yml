# Builds an unsigned GymHub.ipa on a macOS runner and attaches it to a GitHub
# release. Sign it with your own certificate before installing.
#
# Runs when app code changes on main (or this branch), on v* tags, or from
# "Run workflow" in the Actions tab. Builds from main become the latest release.
name: iOS .ipa

on:
  workflow_dispatch:
  push:
    branches: [main, claude/ios-ipa-build]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'metro.config.js'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned .ipa
    # expo-foundation-models uses iOS 27 APIs, so it needs the Xcode 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test -- --ci
          npm run typecheck

      - name: Generate the iOS project
        # ios/ isn't committed (Continuous Native Generation); this also runs pod install.
        run: |
          command -v pod >/dev/null || brew install cocoapods
          pod --version
          npx expo prebuild --platform ios

      - name: Build
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null; then FMT="xcbeautify --quieter"; else FMT=cat; fi
          xcodebuild archive \
            -workspace ios/GymHub.xcworkspace \
            -scheme GymHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GymHub.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | $FMT

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          APP="$RUNNER_TEMP/GymHub.xcarchive/Products/Applications/GymHub.app"
          test -f "$APP/main.jsbundle" || { echo "JS bundle missing from $APP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/GymHub.ipa" Payload)
          ls -lh GymHub.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: GymHub-ipa
          path: GymHub.ipa
          if-no-files-found: error

  smoke-test:
    name: Launch on the iOS Simulator
    # Same toolchain as the device build, so a crash on launch shows up here first.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate the iOS project
        run: |
          command -v pod >/dev/null || brew install cocoapods
          npx expo prebuild --platform ios

      - name: Build for the simulator
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null; then FMT="xcbeautify --quieter"; else FMT=cat; fi
          xcodebuild build \
            -workspace ios/GymHub.xcworkspace \
            -scheme GymHub \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            2>&1 | $FMT

      - name: Launch and check it stays up
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name GymHub.app | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k in sorted(d, reverse=True) for x in d[k] if 'iPhone' in x['name']][0])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          touch "$RUNNER_TEMP/start"
          xcrun simctl launch --console-pty "$UDID" com.gymhub.app > "$RUNNER_TEMP/console.log" 2>&1 &
          LAUNCH=$!
          sleep 45
          echo "::group::App console"; tail -200 "$RUNNER_TEMP/console.log"; echo "::endgroup::"
          echo "::group::System log for GymHub"
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "GymHub"' | grep -iE "error|exception|fatal|crash|abort|terminat" | tail -150
          echo "::endgroup::"
          # The launch command only returns when the app exits, so still running means it survived.
          if kill -0 "$LAUNCH" 2>/dev/null; then
            echo "GymHub is still running after 45 s"
            kill "$LAUNCH"
          else
            echo "::error::GymHub exited during launch"
            for f in $(find ~/Library/Logs/DiagnosticReports -newer "$RUNNER_TEMP/start" -name 'GymHub*' 2>/dev/null); do
              echo "::group::$f"; head -c 30000 "$f"; echo; echo "::endgroup::"
            done
            exit 1
          fi

  release:
    name: Publish release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: GymHub-ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION-build.$GITHUB_RUN_NUMBER"; fi
          # Only main and tags become "latest"; other branches publish pre-releases.
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_REF_NAME" = main ]; then KIND=--latest; else KIND=--prerelease; fi
          gh release create "$TAG" GymHub.ipa $KIND \
            --target "$GITHUB_SHA" \
            --title "GymHub $TAG" \
            --notes "Unsigned iOS build of ${GITHUB_SHA::7} ($GITHUB_REF_NAME). Sign it with your own certificate (for example with Sideloadly, ESign or Feather) before installing. Bundle ID: com.gymhub.app."
